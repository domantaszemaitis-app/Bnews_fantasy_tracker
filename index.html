<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Draft Tracker</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1d2430;--mute:#6b7280;--line:#e3dfd6;--acc:#e8590c;--live:#c92a2a}
@media(prefers-color-scheme:dark){:root{--bg:#151a22;--card:#1d242f;--ink:#e8ebf0;--mute:#98a2b3;--line:#2c3542;--acc:#ff922b;--live:#ff6b6b}}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 "Segoe UI",system-ui,sans-serif}
main{max-width:1100px;margin:0 auto;padding:20px 14px 60px}
h1{font-size:22px;margin:0}.sub{color:var(--mute);font-size:13px;margin:4px 0 16px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
button,input,select{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:6px 10px}
button{cursor:pointer}button.on{background:var(--acc);border-color:var(--acc);color:#fff}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc)}
.tot{margin-left:auto;font-size:18px;font-weight:600}
.wrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;min-width:760px}
th,td{padding:7px 9px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child,th:nth-child(2),td:nth-child(2){text-align:left}
th{font-size:12.5px;color:var(--mute);font-weight:600;cursor:pointer}
td.fp{font-weight:700;color:var(--acc)}.live{color:var(--live);font-weight:700;font-size:12px}
.star{border:0;background:none;font-size:18px;padding:0 4px;color:var(--mute)}.star.on{color:var(--acc);background:none}
.role{padding:2px 7px;font-size:12px}.empty{padding:26px;text-align:center;color:var(--mute)}
#msg{color:var(--live);font-size:13px}
</style></head><body><main>
<h1>Draft Tracker</h1><div class="sub" id="status">Loading…</div>
<div class="bar"><button id="tTeam" class="on">My team</button><button id="tAll">All players</button>
<select id="round" title="Round"></select><input id="q" placeholder="Search player or team" style="flex:1;min-width:140px">
<span class="tot" id="total"></span></div>
<div id="msg"></div>
<div class="wrap"><table><thead><tr id="head"></tr></thead><tbody id="body"></tbody></table></div>
<p class="sub">Fantasy points use Basketnews Modern scoring. Win/loss (±1.5) is added once a game is final. Captain counts ×2, bench ×0.5 in the round total.</p>
</main>
<script>
const $=id=>document.getElementById(id);
let D=null,view="team",sortKey="fp",sortDir=-1,rnd=null;
const load=k=>{try{return JSON.parse(localStorage.getItem(k))||{}}catch(e){return{}}};
let team=load("team"); // id -> "S" | "B" | "C"
const save=()=>{try{localStorage.setItem("team",JSON.stringify(team))}catch(e){}};
const MULT={S:1,B:.5,C:2},f1=x=>(Math.round(x*10)/10).toFixed(1);
const cols=[["name","Player"],["team","Team"],["gp","GP"],["fp","FP"],["avg","FP avg"],["pts","PTS"],["reb","REB"],["ast","AST"],["stl","STL"],["blk","BLK"],["tov","TOV"],["pir","PIR"]];
$("head").innerHTML="<th></th>"+cols.map(c=>`<th data-k="${c[0]}">${c[1]}</th>`).join("")+"<th></th>";

async function poll(){
  try{D=await (await fetch("/api/data")).json();
    $("status").textContent=D.updated?`Updated ${D.updated} · ${D.games} games loaded`+(D.live?` · ${D.live} live now`:"")+(D.failed?` · ${D.failed} games failed to load, retrying`:""):"Loading games from Euroleague… the first load can take a few minutes. Results appear as they arrive.";
    $("msg").textContent=D.updated&&D.error?D.error:"";
    const rs=[...new Set(D.players.flatMap(p=>p.games.map(g=>g.round)))].sort((a,b)=>a-b);
    if(rnd===null&&rs.length)rnd=rs[rs.length-1];
    $("round").innerHTML=rs.map(r=>`<option value="${r}" ${r==rnd?"selected":""}>Round ${r}</option>`).join("");
    render();
  }catch(e){$("msg").textContent="Can't reach the local server. Is the black window still open?"}
}
function stats(p){
  const g=p.games.filter(x=>x.round==rnd),all=p.games,n=all.length||1,s=k=>all.reduce((a,x)=>a+x[k],0);
  const r=g.reduce((a,x)=>a+x.fp,0);
  return{...p,gp:all.length,fp:g.length?r:null,roundFp:r,avg:s("fp")/n,pts:s("pts")/n,reb:s("reb")/n,ast:s("ast")/n,stl:s("stl")/n,blk:s("blk")/n,tov:s("tov")/n,pir:s("pir")/n,live:g.some(x=>x.live)};
}
function render(){
  if(!D)return;
  const q=$("q").value.toLowerCase();
  let rows=D.players.map(stats).filter(p=>(view=="all"||team[p.id])&&(p.name+" "+p.team).toLowerCase().includes(q));
  rows.sort((a,b)=>{const x=a[sortKey],y=b[sortKey];return(typeof x=="string"?x.localeCompare(y):(x??-1e9)-(y??-1e9))*sortDir});
  if(view=="all")rows=rows.slice(0,150);
  const tot=D.players.map(stats).filter(p=>team[p.id]).reduce((a,p)=>a+p.roundFp*MULT[team[p.id]],0);
  $("total").textContent=`Round ${rnd??"–"} total: ${f1(tot)}`;
  $("tTeam").classList.toggle("on",view=="team");$("tAll").classList.toggle("on",view=="all");
  $("body").innerHTML=rows.length?rows.map(p=>{const t=team[p.id];
    return`<tr><td><button class="star ${t?"on":""}" data-s="${p.id}" aria-label="Toggle team">${t?"★":"☆"}</button></td>
    <td>${p.name}${p.live?' <span class="live">LIVE</span>':""}</td><td>${p.team}</td><td>${p.gp}</td>
    <td class="fp">${p.fp===null?"–":f1(p.fp)}</td><td>${f1(p.avg)}</td><td>${f1(p.pts)}</td><td>${f1(p.reb)}</td><td>${f1(p.ast)}</td><td>${f1(p.stl)}</td><td>${f1(p.blk)}</td><td>${f1(p.tov)}</td><td>${f1(p.pir)}</td>
    <td>${t?`<button class="role" data-r="${p.id}" title="Click to switch Starter / Bench / Captain">${{S:"Starter",B:"Bench",C:"Captain"}[t]}</button>`:""}</td></tr>`}).join("")
    :`<tr><td colspan="14" class="empty">${view=="team"?"No players yet. Open “All players” and tap ☆ to build your team.":"No matching players."}</td></tr>`;
}
document.addEventListener("click",e=>{const t=e.target;
  if(t.dataset.s){const i=t.dataset.s;team[i]?delete team[i]:team[i]="S";save();render()}
  else if(t.dataset.r){const i=t.dataset.r;team[i]={S:"B",B:"C",C:"S"}[team[i]];save();render()}
  else if(t.dataset.k){sortDir=sortKey==t.dataset.k?-sortDir:-1;sortKey=t.dataset.k;if(sortKey=="name"||sortKey=="team")sortDir=1;render()}});
$("tTeam").onclick=()=>{view="team";render()};$("tAll").onclick=()=>{view="all";render()};
$("q").oninput=render;$("round").onchange=e=>{rnd=+e.target.value;render()};
poll();setInterval(poll,20000);
</script></body></html>
